# Fallback job -> repo mapping, used when a Dataproc batch carries no `repo` label.
# Prefer labelling the batch at submit time:
#   gcloud dataproc batches submit pyspark ... \
#     --labels repo=org--spark-jobs,git-sha=$(git rev-parse HEAD)
# (GCP labels disallow '/', so `org--name` is expanded to `org/name`.)
jobs:
  daily_rollup:
    repo: example-org/analytics-spark-jobs
    ref: main
