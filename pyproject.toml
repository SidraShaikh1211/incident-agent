[project]
name = "incident-agent"
version = "0.1.0"
description = "Analyses failed Spark logs, patches the cause, and opens a draft PR."
readme = "README.md"
authors = [
    { name = "Sidra Shaikh", email = "sidra12112000@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.126",
    "google-genai>=2.14.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "typer>=0.27.0",
]

[project.optional-dependencies]
# Only needed for the GCP path (Pub/Sub pull, Cloud Logging, Dataproc, Firestore
# run store); local mode does not import these.
gcp = [
    "google-cloud-pubsub>=2.23",
    "google-cloud-logging>=3.11",
    "google-cloud-dataproc>=5.12",
    "google-cloud-firestore>=2.19",
]

[project.scripts]
incident-agent = "incident_agent.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyspark>=4.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Golden-set tests make live model calls; opt in with `-m golden`.
addopts = "-m 'not golden'"
markers = [
    "golden: live model calls against the captured-log corpus (costs money)",
]
